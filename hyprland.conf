# Hyprland configured to feel like my xmonad.hs: a master/stack layout (Tall),
# one pool of workspaces shared by all monitors (Mod+N pulls workspace N to the
# monitor you're on, like greedyView), and the same keys where they make sense.
# Reference: https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################
monitor = HDMI-A-2, 3840x2160@60, 0x0, 1
monitor = DP-1, 3840x2160@59.997, 0x2160, 1
# Laptop panel
# monitor = eDP-1, 1920x1080@120, auto, 2
monitor = , preferred, auto, 1

#################
### PROGRAMS ####
#################
$mainMod = SUPER
$terminal = kitty
$menu = fuzzel
$browser = google-chrome --disable-features=GlobalShortcutsPortal
$fileManager = nemo
$screenshot = ~/dotfiles/screenshot.sh
$lock = swaylock -i ~/Pictures/Wallpapers/golden2.png

#################
### AUTOSTART ###
#################
exec-once = waybar -c ~/dotfiles/waybar-hyprland.jsonc
# Full path: Hyprland is started without my fish PATH, so ~/.cargo/bin is missing
exec-once = ~/.cargo/bin/wpaperd
exec-once = mako
exec-once = nm-applet
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

###################
### LOOK & FEEL ###
###################
general {
    layout = master
    border_size = 2
    gaps_in = 2
    gaps_out = 0
    # xmonad focusedBorderColor
    col.active_border = rgb(c71341)
    col.inactive_border = rgb(505050)
    resize_on_border = false
}

# Tall nmaster=1 ratio=1/2: master on the left, stack on the right
master {
    orientation = left
    mfact = 0.5
    # New windows take the status of the focused one, so opening something
    # from the master makes it the new master, like xmonad's insertUp
    new_status = inherit
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

# logHook updatePointer: move the pointer to the focused window
cursor {
    warp_on_change_workspace = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

# One permanent workspace per xmonad tag
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true

#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_options = caps:escape
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

###################
### KEYBINDINGS ###
###################
# Programs
bind = $mainMod, semicolon, exec, $terminal
bind = $mainMod, N, exec, $menu
bind = $mainMod ALT, N, exec, fuzzel --list-executables-in-path
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, exec, $fileManager
bind = $mainMod, E, exec, wlogout
bind = $mainMod CTRL, L, exec, $lock
bind = $mainMod, P, exec, $screenshot
bind = $mainMod SHIFT, P, exec, $screenshot region
bind = $mainMod ALT, P, exec, $screenshot window
bind = , Print, exec, $screenshot
bind = CTRL, Print, exec, $screenshot region
bind = ALT, Print, exec, $screenshot window

# Windows
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod, J, layoutmsg, cyclenext
bind = $mainMod, K, layoutmsg, cycleprev
bind = $mainMod ALT, J, layoutmsg, swapnext
bind = $mainMod ALT, K, layoutmsg, swapprev
bind = $mainMod, Return, layoutmsg, swapwithmaster
bind = $mainMod, M, layoutmsg, focusmaster
# Resize the master pane by xmonad's delta of 3%
bind = $mainMod, H, layoutmsg, mfact -0.03
bind = $mainMod, L, layoutmsg, mfact +0.03
bind = $mainMod, comma, layoutmsg, addmaster
bind = $mainMod, period, layoutmsg, removemaster
# Tall ||| Full: maximize keeps the bar, like Full under avoidStruts
bind = $mainMod, space, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod CTRL, V, togglefloating,
bind = $mainMod, T, settiled,

# Workspaces: Mod+N shows workspace N on this monitor (greedyView)
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
# Mod+Shift+N sends the window there and stays (W.shift)
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
# Mod+Alt+N sends the window there and follows it to this monitor
bind = $mainMod ALT, 1, exec, hyprctl --batch "dispatch movetoworkspacesilent 1; dispatch focusworkspaceoncurrentmonitor 1"
bind = $mainMod ALT, 2, exec, hyprctl --batch "dispatch movetoworkspacesilent 2; dispatch focusworkspaceoncurrentmonitor 2"
bind = $mainMod ALT, 3, exec, hyprctl --batch "dispatch movetoworkspacesilent 3; dispatch focusworkspaceoncurrentmonitor 3"
bind = $mainMod ALT, 4, exec, hyprctl --batch "dispatch movetoworkspacesilent 4; dispatch focusworkspaceoncurrentmonitor 4"
bind = $mainMod ALT, 5, exec, hyprctl --batch "dispatch movetoworkspacesilent 5; dispatch focusworkspaceoncurrentmonitor 5"
bind = $mainMod ALT, 6, exec, hyprctl --batch "dispatch movetoworkspacesilent 6; dispatch focusworkspaceoncurrentmonitor 6"
bind = $mainMod ALT, 7, exec, hyprctl --batch "dispatch movetoworkspacesilent 7; dispatch focusworkspaceoncurrentmonitor 7"
bind = $mainMod ALT, 8, exec, hyprctl --batch "dispatch movetoworkspacesilent 8; dispatch focusworkspaceoncurrentmonitor 8"
bind = $mainMod ALT, 9, exec, hyprctl --batch "dispatch movetoworkspacesilent 9; dispatch focusworkspaceoncurrentmonitor 9"
# prevWS / nextWS and the shift variants.  e+1 steps through existing
# workspaces with wraparound, and 1-9 always exist, so this cycles like xmonad
# instead of creating a workspace 10.
bind = $mainMod, U, focusworkspaceoncurrentmonitor, e-1
bind = $mainMod, I, focusworkspaceoncurrentmonitor, e+1
bind = $mainMod SHIFT, U, movetoworkspacesilent, e-1
bind = $mainMod SHIFT, I, movetoworkspacesilent, e+1
bind = $mainMod ALT, U, exec, hyprctl --batch "dispatch movetoworkspacesilent e-1; dispatch focusworkspaceoncurrentmonitor e-1"
bind = $mainMod ALT, I, exec, hyprctl --batch "dispatch movetoworkspacesilent e+1; dispatch focusworkspaceoncurrentmonitor e+1"
bind = $mainMod, mouse_down, focusworkspaceoncurrentmonitor, e+1
bind = $mainMod, mouse_up, focusworkspaceoncurrentmonitor, e-1

# Monitors: nextScreen, shiftNextScreen, shift and follow, move workspace over
bind = $mainMod, Y, focusmonitor, +1
bind = $mainMod SHIFT, Y, exec, hyprctl --batch "dispatch movewindow mon:+1; dispatch focusmonitor -1"
bind = $mainMod ALT, Y, movewindow, mon:+1
bind = $mainMod CTRL, Y, movecurrentworkspacetomonitor, +1

# Session
bind = $mainMod, Q, exec, hyprctl reload
bind = $mainMod SHIFT, Q, exit,
bind = CTRL ALT, Delete, exit,

# Mouse: drag and resize floating windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 10%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

####################
### WINDOW RULES ###
####################
windowrule {
    name = pip-floats
    match:title = ^Picture-in-Picture$
    float = true
}

# Don't let apps maximize themselves
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# From the packaged default config: fixes drags from XWayland apps
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}
